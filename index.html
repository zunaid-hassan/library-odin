<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="reset.css" rel="stylesheet" />
    <link href="styles.css" rel="stylesheet" />
    <title>Library App - The Odin Project</title>
  </head>
  <body>
    <script src="script.js" defer></script>
    <header class="grid">
      <div></div>
      <div class="title grid">
        <h1 class="hover-letters">Library App</h1>
        <span id="book-icon">🕮</span>
        <!-- <p>Work-in-progress</p> -->
      </div>

      <div class="add-new-book-btn-container">
        <button class="add-new-book-btn">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path
              fill="currentColor"
              d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z"
            />
          </svg>
          <span>Add new book</span>
        </button>
      </div>
    </header>
    <dialog id="add-new-book-modal" open>
      <p class="add-new-book-text">Add a new book:</p>
      <form id="add-new-book-form" method="dialog">
        <div class="add-new-book grid">
          <label for="title-value">Title:</label>
          <input
            type="text"
            id="title-value"
            name="book-title"
            placeholder="e.g. A Game of Thrones"
            required
          />

          <label for="author-value">Author:</label>
          <input
            type="text"
            id="author-value"
            name="book-author"
            placeholder="e.g. George R.R. Martin"
            required
          />

          <label for="pages-value">Pages:</label>
          <input
            type="number"
            id="pages-value"
            name="book-pages"
            placeholder="e.g. 302"
            min="1"
            required
          />

          <label>Status:</label>
          <div id="status-value">
            <input
              type="radio"
              value="Read"
              id="read-status"
              name="book-status"
            />
            <label for="read-status">Read</label>

            <input
              type="radio"
              value="Unread"
              id="unread-status"
              name="book-status"
              checked
            />
            <label for="unread-status">Unread</label>
          </div>
        </div>
      </form>
      <div class="btns-container grid">
        <button
          form="add-new-book-form"
          type="submit"
          class="submit-new-book-btn"
        >
          Submit
        </button>
        <button
          form="add-new-book-form"
          type="button"
          class="close-add-new-book-btn"
        >
          Close
        </button>
      </div>
    </dialog>

    <main class="wrapper grid">
      <div class="books-container grid">
        <div class="book-card grid">
          <div class="card-title grid">
            <h2 class="book-title">The Book Title</h2>
            <button class="remove-book-btn">🗑</button>
          </div>
          <div class="author label">Author:</div>
          <div class="author">The Author</div>
          <div class="pages label">Pages:</div>
          <div class="pages">310</div>
          <div class="Read-status label">Status:</div>
          <div class="Read-status">Read</div>
        </div>

        <!-- <div class="book-card grid">
          <h2 class="book-title">Harry Potter</h2>

          <div class="author label">Author:</div>
          <div class="author">J.K. Rowling</div>
          <div class="pages label">Pages:</div>
          <div class="pages">309</div>
          <div class="read-status label">Read?:</div>

          <div class="read-status">read</div>
        </div>

        <div class="book-card grid">
          <h2 class="book-title">The Hobbit</h2>

          <div class="author label">Author:</div>
          <div class="author">J.R.R. Tolkien</div>
          <div class="pages label">Pages:</div>
          <div class="pages">310</div>
          <div class="read-status label">Read?:</div>

          <div class="read-status">read</div>
        </div> -->
      </div>
    </main>
  </body>
</html>
